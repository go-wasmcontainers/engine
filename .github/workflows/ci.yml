name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  # A workflow that fails to parse reports no checks at all, which reads
  # exactly like checks that have not started. actionlint is the first lane.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      # Say which toolchain ran: a green check that does not record its
      # compiler makes every number measured under it unattributable.
      - run: go version
      - name: nothing big is tracked
        shell: bash
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +1M 2>/dev/null || true)
          if [ -n "$big" ]; then
            echo "::error::tracked files over 1 MB:"; echo "$big"; exit 1
          fi
      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::not gofmt-ed:"; echo "$out"; exit 1; fi
      # runtime/wazero implements wazero's experimental/sys.File, whose
      # Seek returns an Errno, not an error: vet's stdmethods check is off
      # for that package only.
      - name: go vet
        shell: bash
        run: |
          # macOS ships bash 3.2 (no mapfile); package paths have no spaces.
          # shellcheck disable=SC2046
          go vet $(go list ./... | grep -v '/runtime/wazero$')
          go vet -stdmethods=false ./runtime/wazero
      - run: CGO_ENABLED=0 go build ./...
      - name: go test -race, with coverage
        shell: bash
        run: |
          # runtime/wazero compiles real guests under -race with coverage:
          # 517 s of the default 600 s on macos-latest (2026-10-28), so the
          # process tests tipped it over. 25 minutes, not unbounded.
          CGO_ENABLED=1 go test -race -count=1 -timeout 25m -coverpkg=./... -coverprofile=cov.out ./...
          go tool cover -func=cov.out > cov.txt
          tail -1 cov.txt
          echo "### Coverage (${{ matrix.os }}): $(tail -1 cov.txt | tr -s '\t ' ' ')" >> "$GITHUB_STEP_SUMMARY"

  # Parsers and the layer unpacker read registry and layer content, which is
  # untrusted input. Every one of them is fuzzed on every change.
  fuzz:
    name: fuzz smoke ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzApplyTar, pkg: ./rootfs }
          - { target: FuzzResolve, pkg: ./rootfs }
          - { target: FuzzParseDocuments, pkg: ./image }
          - { target: FuzzReference, pkg: ./image }
          - { target: FuzzDemux, pkg: ./api }
          # A guest's WASI calls are hostile input to the engine's host.
          - { target: FuzzCall, pkg: ./wasi }
          # Sequences of socket calls on two processes of one network.
          - { target: FuzzSockets, pkg: ./wasi }
          # The block a guest's cabi_realloc hands a host module.
          - { target: FuzzCheckBlock, pkg: ./wasi }
          # A guest's DNS queries, answered by the network's DNS server.
          - { target: FuzzAnswer, pkg: ./netdriver }
          - { target: FuzzLimitMemory, pkg: ./wasmbin }
          # commit --change instructions, from the API's query string.
          - { target: FuzzApplyChanges, pkg: ./daemon }
          # The filters query parameter of list and prune requests.
          - { target: FuzzParseFilters, pkg: ./api/server }
          # Keys and lines a user types; a front end feeds them raw.
          - { target: FuzzEditor, pkg: ./cli/lineedit }
          - { target: FuzzSplitPartial, pkg: ./cli/lineedit }
          # What the state store hands back after a restart or a reload.
          - { target: FuzzApplyDiff, pkg: ./rootfs }
          - { target: FuzzUnseal, pkg: ./state }
          - { target: FuzzDecodeRecord, pkg: ./container }
          - { target: FuzzDecodeLogs, pkg: ./container }
          - { target: FuzzDecodeRecord, pkg: ./volume }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 45s ${{ matrix.pkg }}

  vulns:
    name: govulncheck, judged by vulngate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      # No pipefail on purpose: govulncheck's exit status does not say
      # whether a finding is reachable; vulngate judges the JSON, and an
      # empty scan is refused outright.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.20.1
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > /tmp/vuln.json || true
          test -s /tmp/vuln.json || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" /tmp/vuln.json

  # The CLI will run inside the browser sandbox as a wasip1 module, so it
  # and everything it imports must keep building for wasip1/wasm.
  wasip1:
    name: build for wasip1/wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      - run: GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 go build ./image/... ./rootfs/... ./runtime ./container/... ./api
      - name: the wctr CLI builds for wasip1/wasm
        run: GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 go build -o wctr.wasm ./cmd/wctr && ls -l wctr.wasm

  # The browser executor, the in-memory transport and everything the
  # playground's engine imports build for GOOS=js (they run in a Web Worker;
  # the playground repository tests them in Chromium and Firefox).
  js:
    name: build and vet for js/wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      - run: GOOS=js GOARCH=wasm CGO_ENABLED=0 go vet ./runtime/browser ./wasi ./wasmbin ./cli/... ./api/... ./daemon ./container ./image ./rootfs ./state ./events ./volume

  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: '386' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build ./...
